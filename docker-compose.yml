services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-call-center-postgres

    environment:
      POSTGRES_DB: ai_call_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d ai_call_center",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: ai-call-center-backend

    environment:
      APP_NAME: AI Call Center Training Agent
      APP_ENV: development
      DEBUG: "true"
      LOG_LEVEL: INFO

      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_call_center

      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}

      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}

      STT_PROVIDER: ${STT_PROVIDER:-}
      STT_MODEL: ${STT_MODEL:-}
      STT_API_KEY: ${STT_API_KEY:-}

      TTS_PROVIDER: ${TTS_PROVIDER:-}
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_API_KEY: ${TTS_API_KEY:-}

      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}

      SIP_PROVIDER: ${SIP_PROVIDER:-}
      SIP_USERNAME: ${SIP_USERNAME:-}
      SIP_PASSWORD: ${SIP_PASSWORD:-}
      SIP_HOST: ${SIP_HOST:-}
      SIP_OUTBOUND_CALLER_ID: ${SIP_OUTBOUND_CALLER_ID:-}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

volumes:
  postgres_data: